name: Refresh all profile stats

on:
  schedule:
    # Hourly — keeps languages / streak / repos in sync
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/stats-hero.png"
      - "assets/widgets/**"
  workflow_dispatch:
  repository_dispatch:
    types: [stats-refresh]

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow

      - name: Refresh hero + language widgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: He4TheR-Dev
        run: python scripts/refresh_all_stats.py

      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-hero.png assets/widgets README.md
          if git diff --staged --quiet; then
            echo "No stats changes"
          else
            git commit -m "chore: refresh all live profile stats widgets"
            git push
          fi
